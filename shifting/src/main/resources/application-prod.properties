# Production profile — no real secrets live here. Every value below is either
# a required environment variable (fails fast at startup if unset) or a
# prod-safe default. Set SPRING_PROFILES_ACTIVE=prod to activate this file.

# Database connection settings
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — schema is managed by Flyway migrations, never auto-mutated.
# Verified clean (ddl-auto=validate) against a scratch restore of the dev DB
# before adopting this here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${APP_JWT_SECRET}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Mail
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
app.mail.from=${APP_MAIL_FROM}

app.frontend.url=${APP_FRONTEND_URL}

# OpenRouteService / Gemini
openrouteservice.api.key=${OPENROUTESERVICE_API_KEY}
gemini.api.key=${GEMINI_API_KEY}

# CORS — must be set explicitly for prod, no localhost fallback
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging — quiet by default in production
logging.level.root=WARN
logging.level.com.shifting=INFO

# Swagger/OpenAPI — fully disabled in production (see Phase 3)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator — health/info only, no sensitive detail exposure (see Phase 5)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
