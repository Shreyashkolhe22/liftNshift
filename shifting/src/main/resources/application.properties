# Active profile — defaults to dev so nothing changes for local development
# unless SPRING_PROFILES_ACTIVE is explicitly set (e.g. to "prod" in deployment).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate — dialect is shared across environments
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT — expiration is a non-secret default, overridable per environment
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Mail — SMTP transport flags are shared; host/port have safe Gmail defaults,
# credentials themselves are NOT here (see application-dev/-prod.properties)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# CORS — comma-separated list of allowed origins, see SecurityConfig
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# HikariCP connection pool — explicit sizing instead of relying on defaults
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Flyway — schema is now managed by versioned migrations, not Hibernate.
# baseline-on-migrate + baseline-version=1 lets an already-populated database
# (built incrementally via the old ddl-auto=update) adopt Flyway by recording
# V1__baseline_schema.sql as already-applied without re-running it; a
# brand-new empty database just runs that same script from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline: schema as of pre-Flyway ddl-auto=update state
