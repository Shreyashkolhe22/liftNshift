# H2 test datasource — completely isolated from the real MySQL DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE,USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Silence Hibernate startup noise in test output
logging.level.org.hibernate=WARN
logging.level.com.shifting=DEBUG

# Mail — disabled; EmailService is @MockBean in the test
spring.mail.host=localhost
spring.mail.port=2525

# JWT (required by SecurityConfig auto-configuration)
app.jwt.secret=test_secret_key_that_is_at_least_256_bits_long_for_hs256_algo_test
app.jwt.expiration-ms=86400000

# Razorpay — not used in this test
razorpay.key.id=dummy
razorpay.key.secret=dummy

# Mail from — required by EmailService bean (even when mocked)
app.mail.from=test@example.com
app.frontend.url=http://localhost:5173

# OpenRouteService — not used in this test
openrouteservice.api.key=dummy

# Gemini — not used in this test
gemini.api.key=dummy
